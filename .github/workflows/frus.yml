name: frus
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
concurrency:
  group: frus
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_sync.yml
    with:
      name: frus
      repo: taziksh/frus
      command: uv run build.py update --push
      timeout: 120
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
