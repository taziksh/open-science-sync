name: itrdb-tree-rings
on:
  schedule:
    - cron: "17 9 3 * *"
  workflow_dispatch:
concurrency:
  group: itrdb-tree-rings
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      contents: write
    uses: ./.github/workflows/_sync.yml
    with:
      name: itrdb-tree-rings
      repo: taziksh/itrdb-tree-rings
      command: uv run build.py --update --push
      timeout: 120
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
