name: ibtracs
on:
  schedule:
    - cron: "0 12 * * 1,3,5"
  workflow_dispatch:
concurrency:
  group: ibtracs
  cancel-in-progress: false
jobs:
  sync:
    uses: ./.github/workflows/_sync.yml
    with:
      name: ibtracs
      repo: taziksh/ibtracs
      command: uv run build.py update --push
      timeout: 30
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
